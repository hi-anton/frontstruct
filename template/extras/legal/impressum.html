<!DOCTYPE html>
<html lang="{{lang}}">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{imprint}} – {{name}}</title>
  {{head_scripts}}
  <link rel="stylesheet" href="./styles/main.css">
  <script type="module" src="scripts/main.js"></script>
</head>

<body>
  <header>
    <a href="/">{{name}}</a>
    {{header_actions}}
    <nav id="site-nav">...</nav>
  </header>

  <!--German DDG conform-->
  <main>
    <h1>{{imprint}}</h1>
    <p>{{imprint_name}}</p>
    <p>{{imprint_address}}</p>
    <p>{{imprint_email}}</p>
    <p>{{imprint_phone}}</p>
  </main>
  

  <footer>
    <p>© {{year}} {{name}}</p>
    {{footer_links}}
  </footer>
</body>

</html>
